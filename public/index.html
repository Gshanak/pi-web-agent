<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pi Web — Coding Agent</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/vendor/github-dark.min.css">
  <script src="/vendor/highlight.min.js"></script>
</head>
<body>
  <!-- Top Bar -->
  <div id="topbar">
    <div class="topbar-left">
      <span class="logo">π</span>
      <span class="title">Pi Web Agent</span>
    </div>
    <div class="topbar-center">
      <select id="modelSelect" title="Select Model"></select>
      <select id="projectSelect" title="Select Project">
        <option value="">— Select Project —</option>
      </select>
      <button id="newProjectBtn" class="btn-small" title="New Project">+ New</button>
    </div>
    <div class="topbar-right">
      <button id="previewBtn" class="btn-small active" title="Toggle Preview">Preview</button>
      <button id="terminalBtn" class="btn-small" title="Toggle Terminal">Terminal</button>
      <button id="clearBtn" class="btn-small" title="Clear Session">Clear</button>
      <span id="statusDot" class="status-dot disconnected"></span>
    </div>
  </div>

  <!-- Main Layout -->
  <div id="main">
    <!-- Sidebar: File Tree -->
    <div id="sidebar">
      <div class="sidebar-header">
        <span>Files</span>
        <button id="refreshFilesBtn" class="btn-icon" title="Refresh">↻</button>
      </div>
      <div id="fileTree" class="file-tree"></div>
    </div>

    <!-- Center: Chat + Editor -->
    <div id="center">
      <!-- Chat Panel -->
      <div id="chatPanel">
        <div id="chatMessages" class="chat-messages"></div>
        <div id="chatInputArea" class="chat-input-area">
          <textarea id="chatInput" placeholder="Describe what you want to build... (Shift+Enter for newline)" rows="1"></textarea>
          <button id="sendBtn" class="btn-send">Send</button>
          <button id="stopBtn" class="btn-stop" style="display:none;">Stop</button>
        </div>
      </div>

      <!-- Editor Panel (below chat) -->
      <div id="editorPanel" class="editor-panel">
        <div class="editor-tabs" id="editorTabs"></div>
        <div id="editorContainer" class="editor-container">
          <div id="editorPlaceholder" class="editor-placeholder">Select a file to view its contents</div>
          <pre id="codeView" class="code-view" style="display:none;"><code id="codeContent"></code></pre>
        </div>
      </div>
    </div>

    <!-- Right: Preview + Terminal -->
    <div id="rightPanel">
      <div id="previewContainer" class="preview-container">
        <div class="preview-header">
          <span>Live Preview</span>
          <button id="refreshPreviewBtn" class="btn-icon" title="Refresh Preview">↻</button>
        </div>
        <iframe id="previewFrame" class="preview-frame" sandbox="allow-scripts allow-modals allow-forms"></iframe>
      </div>
      <div id="terminalContainer" class="terminal-container" style="display:none;">
        <div class="terminal-header">
          <span>Command Output</span>
          <button id="clearTerminalBtn" class="btn-icon" title="Clear">✕</button>
        </div>
        <div id="terminalOutput" class="terminal-output"></div>
      </div>
    </div>
  </div>

  <!-- New Project Modal -->
  <div id="newProjectModal" class="modal" style="display:none;">
    <div class="modal-content">
      <h3>Create New Project</h3>
      <input id="newProjectName" type="text" placeholder="project-name" autocomplete="off">
      <div class="modal-buttons">
        <button id="cancelNewProject" class="btn-small">Cancel</button>
        <button id="confirmNewProject" class="btn-small primary">Create</button>
      </div>
    </div>
  </div>

  <!-- Welcome Screen -->
  <div id="welcomeOverlay" class="welcome-overlay">
    <div class="welcome-content">
      <div class="welcome-logo">π</div>
      <h1>Pi Web Agent</h1>
      <p>A browser-based coding agent powered by OpenRouter</p>
      <div class="welcome-steps">
        <div class="welcome-step">
          <span class="step-num">1</span>
          <span>Set your OPENROUTER_API_KEY in <code>.env</code></span>
        </div>
        <div class="welcome-step">
          <span class="step-num">2</span>
          <span>Create or select a project above</span>
        </div>
        <div class="welcome-step">
          <span class="step-num">3</span>
          <span>Describe what you want to build in the chat</span>
        </div>
      </div>
      <button id="getStartedBtn" class="btn-small primary">Get Started</button>
    </div>
  </div>

  <script src="/js/app.js"></script>
</body>
</html>
